name: Build and Release Wheels

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Debug: Check if CGAL submodule was initialized
        run: |
          ls -la third_party/cgal || echo "CGAL submodule missing"
          test -f third_party/cgal/CMakeLists.txt || echo "Missing CMakeLists.txt"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        run: python setup.py bdist_wheel

