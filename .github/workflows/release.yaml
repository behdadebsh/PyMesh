name: Build and Release Wheels

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Set up Python FIRST so CMake can find the right interpreter
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python build tools
        run: python -m pip install --upgrade pip wheel setuptools numpy scipy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgmp-dev libmpfr-dev \
            libboost-all-dev \
            libeigen3-dev \
            libtbb-dev \
            nlohmann-json3-dev \
            cmake ninja-build

      # Patch headers that are broken with modern gcc/clang
      - name: Patch draco headers for modern compilers
        run: |
          sed -i '1i#include <cstddef>' third_party/draco/src/draco/core/hash_utils.h
          if grep -q "INT_MAX\|UINT_MAX" third_party/draco/src/draco/io/parser_utils.cc 2>/dev/null; then
            sed -i '1i#include <limits>' third_party/draco/src/draco/io/parser_utils.cc
          fi

      # Detect Python paths to pass to CMake explicitly
      - name: Get Python paths
        id: python-info
        run: |
          echo "PYTHON_EXECUTABLE=$(python -c 'import sys; print(sys.executable)')" >> $GITHUB_OUTPUT
          echo "PYTHON_INCLUDE=$(python -c 'import sysconfig; print(sysconfig.get_path("include"))')" >> $GITHUB_OUTPUT
          echo "PYTHON_VERSION=$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" >> $GITHUB_OUTPUT

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wno-changes-meaning-declaration" \
            -DPYTHON_EXECUTABLE=${{ steps.python-info.outputs.PYTHON_EXECUTABLE }} \
            -DPython3_EXECUTABLE=${{ steps.python-info.outputs.PYTHON_EXECUTABLE }} \
            -DPythonLibsNew_FIND_VERSION=${{ steps.python-info.outputs.PYTHON_VERSION }} \
            -DTBB_INCLUDE_DIR="/usr/include/tbb" \
            -DTBB_LIBRARY="/usr/lib/x86_64-linux-gnu/libtbb.so" \
            -DTBB_TBB_LIBRARY="/usr/lib/x86_64-linux-gnu/libtbb.so"

      - name: Build
        run: cmake --build build --parallel $(nproc)

      # The CMake build puts the .so files into python/pymesh/lib/
      # We install them there so setup.py can find them for packaging
      - name: Install built modules into python package tree
        run: cmake --build build --target install

      - name: Build wheel
        run: |
          # Use --no-build-isolation so setup.py skips its cmake_build step
          # and just packages what is already built
          python setup.py bdist_wheel --skip-build

      - name: Verify wheel imports correctly
        run: |
          pip install dist/*.whl
          python -c "import pymesh; print('pymesh imported successfully, version:', pymesh.__version__)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-py${{ matrix.python-version }}
          path: dist/*.whl

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-py*
          merge-multiple: true
          path: dist/

      - name: Create GitHub Release and upload wheels
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
